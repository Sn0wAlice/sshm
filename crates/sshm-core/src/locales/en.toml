# Contextual shortcut bar (and the `h` popup). The key letters are fixed —
# only the descriptions after them are translated. Keep the ` │ ` separator:
# the footer truncates on those boundaries and the popup splits on them.
[help]
host_nav = "↑↓ move │ h help │ Enter connect │ o new-term │ / filter │ a add │ e edit │ y clone │ Y copy │ d delete │ Space select │ X run-cmd │ c check │ p forward │ t tunnels │ i identity │ f fav │ s sort │ q quit"
folder_nav = "↑↓ move │ h help │ Enter expand/collapse │ / filter │ a add │ r rename │ d delete │ t tunnels │ q quit"
filter_mode = "Type to filter (fuzzy) │ Esc clear │ Enter confirm"
delete_modal = "←→ select │ Enter confirm │ Esc cancel"
settings_tab = "↑↓ navigate │ h help │ Type to edit │ Enter save │ ←→ tab │ Esc reset"
theme_tab = "↑↓ navigate │ h help │ Enter apply/save │ ←→ tab │ Esc reset"
help_tab = "↑↓ scroll │ h help │ PageUp/PageDn fast scroll │ Home top │ ←→ tab │ q quit"
identities_tab = "↑↓ move │ h help │ / filter │ g generate │ p push │ a agent-add │ x agent-del │ K known-hosts │ r refresh │ ←→ tab │ q quit"
kluster_header_runtime = "↑↓ move │ h help │ Enter expand/collapse │ / filter │ r refresh │ n add cluster │ ←→ tab │ q quit"
kluster_header_cluster = "↑↓ move │ h help │ Enter expand/collapse │ / filter │ r refresh │ n add │ e edit │ d delete │ ←→ tab │ q quit"
