[workspace]
members = ["crates/sshm-core", "crates/sshm"]
resolver = "2"

[workspace.package]
version = "2.3.0"
edition = "2021"
authors = ["Sn0wAlice"]
license = "Apache-2.0"
repository = "https://github.com/Sn0wAlice/sshm"
homepage = "https://github.com/Sn0wAlice/sshm"

[workspace.dependencies]
# Shared across crates — pin once here, reference with `.workspace = true`.
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
dirs = "6.0.0"
ssh_config = "0.1.0"
fuzzy-matcher = "0.3"
shellexpand = "3"
toml = "0.9.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
anyhow = "1.0"
libc = "0.2"
notify = "8"
tempfile = "3"

# Frontend-only (TUI/CLI) — deliberately kept out of sshm-core's dependency tree.
inquire = { version = "0.9.4", default-features = true }
unicode-width = "0.2"
# No default features: `all-widgets` (calendar) drags in the `time` crate, unused.
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
crossterm = "0.29.0"

# Internal
sshm-core = { path = "crates/sshm-core" }

[profile.release]
# Smaller, slightly faster binary; costs a longer release build only.
lto = true
codegen-units = 1
strip = true
